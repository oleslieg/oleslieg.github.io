<body>
    <div class="container">
        <header class="nav-header">
            <div class="name">Leslie's World</div>
            <nav>

                </ul>
            </nav>
        </header>

        <main class="main-content2">
            <h1 class="contact-heading">Get in touch with me</h1>
            
            <form class="contact-form" id="contactForm">
                <div class="form-group">
                    <input type="text" class="form-input" placeholder="Your name" required>
                </div>
                
                <div class="form-group">
                    <input type="email" class="form-input" placeholder="Your email" required>
                </div>
                
                <div class="form-group">
                    <input type="text" class="form-input" placeholder="Subject" required>
                </div>
                
                <div class="textarea-group">
                    <textarea class="form-textarea" placeholder="Message...." maxlength="200" required></textarea>
                    <span class="word-limit">200 words max</span>
                </div>
                
                <button type="submit" class="submit-button">Send Message</button>
            </form>
        </main>

        <!-- Footer with Pink Border -->

            <div class="copyright">Copyrighted by Leslie Granados</div>
